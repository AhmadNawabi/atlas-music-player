name: CI

on:
  push:
    branches: [ main ]
  
  # also run on PRs to main
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Clean install dependencies (fixes Linux native module issues)
        run: |
          rm -f package-lock.json
          npm cache clean --force
          npm install --no-optional
        env:
          # Prevent optional dependency failures on Linux
          SKIP_OPTIONAL: true

      - name: Run tests with coverage
        run: npm run coverage
        env:
          CI: true

      - name: Upload coverage report (optional but recommended)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
